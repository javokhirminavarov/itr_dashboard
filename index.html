<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No network after load, structurally: connect-src 'none'. The page runs
     identically from file:// and from a static host; the file: sources are
     inert on https. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: file:; font-src 'self' data: file:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>One Consignment — Border to Audit · Uzbekistan Customs</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body data-stage="1" data-view="journey" data-mode="road">

<div id="progress" aria-hidden="true"><i></i></div>

<header id="topbar">
  <div class="brand" id="brand"></div>
  <nav id="tabs" aria-label="Flow"></nav>
  <button id="overview-btn" type="button">OVERVIEW</button>
</header>

<main id="journey" aria-label="Border to audit journey">
  <div id="corridor" aria-hidden="true"></div>
  <!-- page-space overlay: everything inside uses 1600x8000 corridor coordinates -->
  <div id="overlay-space" aria-hidden="true">
    <svg id="route-layer" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 8000"
         preserveAspectRatio="none" focusable="false"></svg>
    <div id="truck"></div>
  </div>
  <!-- pins live in screen space and are positioned in per-cent of the corridor,
       so they keep a constant on-screen size at any viewport width -->
  <div id="pins" aria-hidden="true"></div>
  <div id="rows"><div id="spine" aria-hidden="true"></div></div>
</main>

<!-- tail: the closing statement, and the scroll room the last stage needs
     to reach the truck's focus line -->
<section id="tail"></section>

<footer id="bottombar">
  <button id="tc-btn" type="button"></button>
  <div id="scroll-hint"></div>
  <span id="illustrative"></span>
</footer>

<div id="overview" aria-label="Stage overview"></div>
<div id="modal" aria-label="Targeting centre"></div>

<noscript><p style="color:#e9f2ef;font-family:system-ui;padding:2rem">This presentation requires JavaScript (it runs fully offline).</p></noscript>

<!-- demoData first: the single source of every word and figure on screen -->
<script src="demo-data.js"></script>
<script src="plates.js"></script>
<script src="app.js"></script>
</body>
</html>
